<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> E-Commerece Store </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'product_list' %}"> የኢ-ኮሜርስ ሱቅ (E-Commerce Store) </a>
        </div>
    </nav>
    <div class="container">
        <h2 class="text-center mb-4"> የእቃዎች ዝርዝር (Product List) </h2>
        
        <div class="row">
            {% for product in products %}
                <div class="col-md-4 mb-4">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title text-primary fw-bold"> <a href="{% url 'product_detail' product.pk %}"> {{ product.name }} </a> </h5>
                            <p class="card-text text-muted">{{ product.description | truncatewords:10 }}</p>
                            <h6 class="text-success fw-bold"> {{ product.price }} Birr.</h6>
                            <p class="small text-secondary"> ስቶክ ላይ ያለው:- {{ product.stock }}</p>
                            <a href="{% url 'product_detail' product.pk %}" class="btn btn-outline-primary btn-sm w-100"> ዝርዝሩን እይ </a>
                        </div>
                    </div>
                </div>
            {% empty %}
                <div class="col-12 text-center">
                    <p class="alert alert-warning"> ምንም የተመዘገበ ዕቃ የለም፡፡ </p>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
