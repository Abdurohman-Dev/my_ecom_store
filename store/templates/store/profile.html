{% extends 'store/base.html' %}

{% block content %}
<style>
    /* Placeholder ጽሁፉ ነጭ/ፈዘዝ ያለ እንዲሆን ማድረግ */
    .custom-input::placeholder {
        color: #a0a0a0 !important;
        opacity: 0.8;
    }
</style>

<div class="container py-5" style="min-height: 80vh;">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card bg-dark text-light border-secondary shadow-lg rounded-4 overflow-hidden">
                
                <!-- Header -->
                <div class="card-header bg-secondary bg-opacity-25 border-secondary text-center py-4">
                    <h3 class="text-warning fw-bold mb-0">👤 የግል መረጃ (Profile)</h3>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <!-- Profile Image Avatar -->
                        <div class="text-center mb-4">
                            <div class="position-relative d-inline-block">
                                {% if user.profile.image %}
                                    <img src="{{ user.profile.image.url }}" alt="Profile" class="rounded-circle border border-warning border-3 shadow" style="width: 120px; height: 120px; object-fit: cover;">
                                {% else %}
                                    <div class="rounded-circle border border-warning border-3 d-flex align-items-center justify-content-center bg-secondary text-warning fs-1 fw-bold shadow mx-auto" style="width: 120px; height: 120px;">
                                        {{ user.username|slice:":1"|upper }}
                                    </div>
                                {% endif %}
                            </div>
                            <h4 class="text-warning fw-bold mt-2 mb-0">{{ user.username }}</h4>
                        </div>

                        <!-- Account Information Section -->
                        <h5 class="text-warning fw-bold border-bottom border-secondary pb-2 mb-3 fs-5">
                            🔑 የመለያ መረጃዎች (Account Information)
                        </h5>
                        
                        <div class="mb-3">
                            <label class="form-label text-light fw-semibold">የተጠቃሚ ስም (Username)</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary py-2" value="{{ user.username }}" readonly>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-light fw-semibold">ኢሜይል አድራሻ (Email)</label>
                            <input type="email" name="email" class="form-control custom-input bg-dark text-light border-secondary py-2" value="{{ user.email|default:'' }}" placeholder="ምሳሌ: example@gmail.com">
                        </div>

                        <!-- Personal Information Section -->
                        <h5 class="text-warning fw-bold border-bottom border-secondary pb-2 mb-3 fs-5">
                            📞 የግል መረጃዎች (Personal Information)
                        </h5>

                        <div class="mb-3">
                            <label class="form-label text-light fw-semibold">ስልክ ቁጥር (Phone Number)</label>
                            <input type="text" name="phone_number" class="form-control custom-input bg-dark text-light border-secondary py-2" value="{{ user.profile.phone_number|default:'' }}" placeholder="ምሳሌ: 0911223344">
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-light fw-semibold">ሙሉ አድራሻ (Full Address)</label>
                            <textarea name="address" class="form-control custom-input bg-dark text-light border-secondary" rows="3" placeholder="ምሳሌ: አማራ ክልል፣ ደቡብ ወሎ፣ ወግዲ...">{{ user.profile.address|default:'' }}</textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-light fw-semibold">ፕሮፋይል ፎቶ (Profile Image)</label>
                            <input type="file" name="image" class="form-control bg-dark text-light border-secondary">
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-warning w-100 py-3 rounded-pill fw-bold text-dark fs-5 shadow mt-2">
                            💾 መረጃውን አስቀምጥ (Save Changes)
                        </button>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
