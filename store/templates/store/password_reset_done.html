{% extends 'store/base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card bg-dark text-light border-secondary shadow-lg rounded-4 p-4 text-center">
                <i class="bi bi-envelope-check text-warning display-1 mb-3"></i>
                <h3 class="text-warning fw-bold mb-3">ኢሜይል ተልኳል! </h3>
                <p class="text-muted">
                    የይልፍ ቃልዎን የሚቀይሩበት መመሪያ ወደ ኢሜይልዎ ተልኳል። እባክዎን ያቅርቡ።
                </p> 
                <a href="{% url 'login' %}" class="btn btn-outline-warning rounded-pill mt-3"> ወደ መግቢያ ገጽ ተመለስ</a>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
