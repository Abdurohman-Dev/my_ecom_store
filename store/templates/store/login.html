<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> መግቢያ </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark py-3 shadow-sm mb-5">
        <div class="container">
            <a class="navbar-brand fs-3 fw-bold text-warning" href="{% url 'product_list' %}" >
                የኢ-ኮሜርስ ሱቅ <span class="fs-5 text-light fw-normal"> (E-Commerce Store) </span>
            </a>
        </div>
    </nav>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0 rounded-4 p-4">
                    <h3 class="text-center fw-bold mb-4 text-primary"> መግቢያ </h3>

                    <form method="POST">
                        {% csrf_token %}

                        {% for field in form %}
                            <div class="mb-3">
                                <label  class="form-label fw-bold">{{ field.label }}</label>
                                <input type="{{ field.field.widget.input_type| default:'text' }}" 
                                    name="{{ field.name }}"
                                    id="{{ field.id_for_label }}"
                                    class="form-control form-control-lg rounded-pill px-4" 
                                    required>
                                {% if field.help_text %}
                                    <small class="form-text text-muted d-block mt-1">{{ field.help_text }}</small>
                                {% endif %}
                                {% for error in field.errors %}
                                    <div class="text-danger mt-1">{{ error }}</div>
                                {% endfor %}
                            </div>
                        {% endfor %}
                        <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold py-2 mt-3 shadow-sm">
                            ግባ
                        </button>
                    </form> 

                    <hr class="my-4">
                    <p class="text-center mb-0">
                        አካውንት የለህም? <a href="{% url 'signup' %}" class="fw-bold text-decoration-none"> አዲስ አካውንት ፍጠር </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
