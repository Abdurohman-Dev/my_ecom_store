{% extends 'store/base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center"
        <div class="col-md-6 col-lg-5">
            <div class="card bg-dark text-light  border-secondary shadow-lg rounded-4 p-4 text-center">
                <i class="bi bi-check-circle text-success display-1 mb-3"></i>
                <h3 class="text-warning fw-bold mb-3">የይልፍ ቃልዎ በትክክል ተቀይሯል!</h3>
                <p class="text-muted">
                    አድሱን የይለፍ ቃል በመጠቀም አሁን ወደ አካውንት መግባት ይችላሉ።
                </p>
                <a href="{%url 'login' %}" class="btn btn-warning rounded-pill fw-bold mt-3 px-4">አሁን ግባ>(Log In)</a>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
