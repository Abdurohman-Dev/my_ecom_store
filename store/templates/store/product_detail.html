<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> {{ product.name }} - Details </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'product_list' %}"> የኢ-ኮሜርስ ሱቅ (E-Commerce Store) </a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg">
                    <div class="card-body p-4">
                        <h2 class="card-title text-primary fw-bold mb-3"> {{ product.name }} </h2>
                        <hr>
                        <p class="fs-5"><strong>ዝርዝር መግለጫ፡-</strong>{{ product.description}}</p>
                        <h4 class="text-success fw-bold mb-3"> ዋጋ:- {{ product.price }} Birr.</h4>
                        <p class="text-muted"> በስቶክ ላይ ያለው:- <strong>{{ product.stock }}</strong></p>
                        <p class="text-secondary small"> የተመዘገበበት ቀን:- {{ product.created_at }}</p>
                        <hr>
                        <a href="{% url 'product_list' %}" class="btn btn-secondary"> ወደ እቃዎች ዝርዝር ተመለስ </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
